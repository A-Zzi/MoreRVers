; =========================================
;   MoreRVers Configuration
; =========================================
;
; Set the maximum number of players for your multiplayer session.
; Default vanilla game limit is 4 players.
;
; Range: 1-24
; Recommended: 8 for stable gameplay
;
; Restart the game after changing this value.
; =========================================

MaxPlayers = 8

; ---- Advanced (leave alone unless troubleshooting) ----------------------
;
; LogLevel: DEBUG, INFO, WARN or ERROR. Set DEBUG before reporting a bug,
; then send the UE4SS.log file next to UE4SS.dll.
LogLevel = INFO

; ReapplySeconds: how often the cap is re-applied, in seconds. The game can
; overwrite the cap after we set it, especially right after a game update.
; Set to 0 to disable the periodic re-apply.
ReapplySeconds = 10

; HardUpperLimit: MaxPlayers is clamped to this.
HardUpperLimit = 24

; SanityCeiling: the mod only overwrites cap-like values at or below this, so
; it can never clobber an unrelated number that happens to share a name.
SanityCeiling = 64

; WatchActorSpawns: check each spawned actor for being a GameSession.
; Set to 0 if you suspect the mod is costing you frames.
WatchActorSpawns = 1
